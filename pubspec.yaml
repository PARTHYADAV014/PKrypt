name: vault_gallery
description: "Pkrypt — A private, zero-knowledge encrypted gallery app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  image: ^4.3.0
  shared_preferences: ^2.3.3
  flutter_riverpod: ^2.6.1
  cryptography: ^2.9.0
  argon2: ^1.0.1
  local_auth: ^3.0.2
  ffi: ^2.2.0
  video_player: ^2.14.1
  photo_manager: ^3.12.0
  google_mlkit_face_detection: ^1.0.3
  cryptography_flutter: ^2.3.4
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/pkrypt_icon.png"
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/icon/pkrypt_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/models/